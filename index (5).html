<style>
:root{
  color-scheme: dark;
  --mat:#1B2A47; --panel:#233659; --panel2:#2D4470; --chalk:#F2F4F6; --dust:#A6B5CF;
  --amber:#FFC247; --amber-ink:#2A1E00; --mint:#62D6A8; --danger:#FF9A8B;
  --line:rgba(242,244,246,.13);
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mat);color:var(--chalk);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-top:var(--safe-t)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:18px 18px calc(110px + var(--safe-b))}

h1,h2,h3{margin:0}
.display{font-family:var(--cond);font-weight:700;font-size:clamp(72px,26vw,132px);line-height:.86;letter-spacing:-.01em;white-space:nowrap}
.onboard .display{font-size:clamp(56px,17vw,96px)}
.hero .display.long{white-space:normal;font-size:clamp(52px,15vw,80px);line-height:.95}
.page{font-family:var(--cond);font-weight:700;font-size:44px;line-height:1;margin:8px 0 6px}
h2{font-family:var(--cond);font-weight:600;font-size:24px;margin:30px 0 10px}
h3{font-family:var(--cond);font-weight:600;font-size:28px;line-height:1.1}
.kicker{color:var(--amber);font-weight:600;margin:0 0 6px}
.sub{color:var(--dust);margin:6px 0 12px}
.lede{color:var(--dust);font-size:19px;max-width:32ch}
.meta,.hint{color:var(--dust);font-size:14px;margin:6px 0}
.label{color:var(--dust);font-size:14px;margin:16px 0 6px;font-weight:600}
.empty{color:var(--dust)}
.note{background:rgba(255,194,71,.1);border-left:3px solid var(--amber);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:0 0 14px;font-size:15px}
.note.inline{margin:4px 0 12px}
.flag{color:var(--dust);font-size:14px;font-style:italic}
.num{font-family:var(--cond);font-weight:700;font-variant-numeric:tabular-nums}

/* buttons */
.primary,.secondary,.ghost{border:0;border-radius:var(--r-md);min-height:48px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:6px}
.primary{background:var(--amber);color:var(--amber-ink)}
.primary:active{transform:scale(.98)}
.secondary{background:var(--panel2);color:var(--chalk)}
.ghost{background:transparent;color:var(--dust);width:100%}
.ghost.danger{color:var(--danger);margin-top:26px}
.big{width:100%;min-height:62px;font-size:20px;border-radius:var(--r-lg);margin-top:14px}
.wide{width:100%;min-height:56px;margin-top:6px}
.small{min-height:40px;padding:0 14px;font-size:15px;width:auto}
button:disabled{opacity:.4}
.icon{background:none;border:0;font-size:38px;line-height:1;width:48px;height:48px;color:var(--chalk)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* today */
.hero{padding:22px 0 6px}
.hero .sub{font-size:17px;margin-top:14px}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.wk{background:var(--panel);border-radius:var(--r-md);padding:10px 8px;text-align:center;border:2px solid transparent}
.wk.cur{border-color:var(--amber)}
.wk>span{display:block;font-size:13px;color:var(--dust);margin-bottom:6px}
.wk>div{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.wk i{font-style:normal;font-family:var(--cond);font-weight:600;font-size:14px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--mat);color:var(--dust)}
.wk i.on{background:var(--mint);color:var(--mat)}
.wk i.now{background:var(--amber);color:var(--amber-ink)}
.row-card{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--panel);border:0;border-radius:var(--r-md);padding:14px 16px;margin-bottom:8px;text-align:left}
.row-card b{display:block;font-weight:600}
.row-card small{display:block;color:var(--dust);font-size:14px;margin-top:2px}
.row-card.link:active{background:var(--panel2)}

/* session */
.session-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--mat);padding:8px 0;margin:-18px 0 0}
.session-bar>div{flex:1}
.session-bar b{font-family:var(--cond);font-size:26px;font-weight:700;display:block;line-height:1}
.session-bar small{color:var(--dust);font-size:14px}
.meter{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin:6px 0 16px}
.meter i{display:block;height:100%;background:var(--mint);transition:width .3s}
.group{margin:22px 0 8px}
.block{background:var(--panel);border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden}
.block.open{background:var(--panel2)}
.block-head{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:16px;text-align:left;min-height:72px}
.ord{font-family:var(--cond);font-weight:700;font-size:26px;width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--mat);color:var(--amber)}
.block.done .ord{background:var(--mint);color:var(--mat)}
.bt{flex:1;min-width:0}
.bt b{display:block;font-weight:600;font-size:18px;line-height:1.2}
.bt small{display:block;color:var(--dust);font-size:15px;margin-top:2px}
.block.done:not(.open) .bt b{color:var(--dust)}
.tick{font-size:22px;color:var(--mint);width:22px;text-align:center}
.block-body{padding:0 16px 16px}
.block-actions{display:flex;gap:8px;align-items:center;margin-top:10px}
.block-actions .ghost{width:auto;margin-left:auto}
.about{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.about summary{cursor:pointer;color:var(--dust);font-weight:600;min-height:36px;display:flex;align-items:center}
.about p{margin:8px 0}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.set{min-height:64px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--mat);font-family:var(--cond);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.set.extra{border-style:dashed}
.set.logged{background:var(--mint);border-color:var(--mint);color:var(--mat)}
.counter .count{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.counter .count .num{font-size:64px;line-height:1}
.counter .count small{color:var(--dust);font-size:15px;flex:1;min-width:150px}
.bar{position:relative;height:10px;background:var(--mat);border-radius:5px;margin:10px 0 14px}
.bar i{display:block;height:100%;background:var(--mint);border-radius:5px}
.bar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--amber)}
.pad{display:flex;gap:8px;margin:8px 0}
.pad button{flex:1;min-height:64px;border:0;border-radius:var(--r-md);background:var(--mat);font-family:var(--cond);font-weight:700;font-size:26px}
.pad button:active{background:var(--amber);color:var(--amber-ink)}
.clean{display:flex;align-items:center;gap:8px;margin-top:6px}
.clean span{flex:1;color:var(--dust)}
.clean b{color:var(--chalk);font-family:var(--cond);font-size:22px}
.clean button{width:52px;height:48px;border:0;border-radius:var(--r-sm);background:var(--mat);font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{border:0;border-radius:20px;background:var(--mat);padding:6px 12px;font-size:14px;color:var(--dust)}
.field{width:100%;background:var(--mat);border:2px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin:8px 0;font-size:17px}
textarea.field{resize:vertical}
.blocktimer .field{margin-top:10px}

/* rest bar */
#rest{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--amber);color:var(--amber-ink);padding-bottom:var(--safe-b);overflow:hidden}
.rest-bar{position:absolute;inset:0 auto 0 0;background:rgba(0,0,0,.08);transition:width .2s linear}
.rest-inner{position:relative;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px}
.rl{font-weight:600}
.rt{font-family:var(--cond);font-weight:700;font-size:40px;flex:1;font-variant-numeric:tabular-nums;line-height:1}
#rest button{border:0;border-radius:var(--r-sm);background:rgba(0,0,0,.12);min-height:48px;min-width:54px;font-weight:600;color:var(--amber-ink)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(8,14,26,.72)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--panel);border-radius:26px 26px 0 0;padding:22px 18px calc(18px + var(--safe-b));max-width:560px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.bigclock{font-family:var(--cond);font-weight:700;font-size:clamp(96px,34vw,168px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.bigclock.lead{color:var(--amber)}
.tapzone{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:58vh;border:0;border-radius:var(--r-lg);background:var(--mat);padding:20px;text-align:center}
.tapzone .sub{margin:0;font-size:18px}
.tapnote{margin-top:18px;color:var(--amber);font-weight:600}
.seg{display:flex;gap:6px;background:var(--mat);border-radius:var(--r-md);padding:4px}
.seg label,.seg.buttons button{flex:1}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label span,.seg.buttons button{display:grid;place-items:center;min-height:48px;border-radius:var(--r-sm);font-weight:600;color:var(--dust);border:0;background:none;width:100%}
.seg input:checked+span,.seg.buttons button.on{background:var(--amber);color:var(--amber-ink)}
.seg input:focus-visible+span{outline:3px solid var(--amber)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notes{white-space:pre-wrap;background:var(--mat);border-radius:var(--r-md);padding:12px}
.results{list-style:none;padding:0;margin:12px 0}
.results li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.results span{color:var(--dust);text-align:right}

/* forms / choices */
.choices{display:grid;gap:8px}
.choice,.toggle,.check{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border-radius:var(--r-md);padding:14px 16px;cursor:pointer;margin-bottom:8px}
.choices .choice{margin:0}
.choice b{display:block}
.choice small,.toggle small{display:block;color:var(--dust);font-size:14px;margin-top:2px}
.choice:has(input:checked){background:var(--panel2);box-shadow:inset 0 0 0 2px var(--amber)}
.toggle.off{opacity:.55}
input[type=radio],input[type=checkbox]{accent-color:var(--amber);width:22px;height:22px;margin:2px 0 0;flex:none}
.check:has(input:checked) span{color:var(--dust);text-decoration:line-through;text-decoration-color:var(--mint)}

/* progress */
.stage{background:var(--panel);border-radius:var(--r-lg);padding:18px;margin-top:12px}
.stage-name{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1;margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats>div{background:var(--panel);border-radius:var(--r-md);padding:14px}
.stats .num{font-size:44px;line-height:1;display:block}
.stats small{color:var(--dust);font-size:14px}
.bench{list-style:none;padding:0;margin:6px 0}
.bench li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.bench li span{color:var(--dust);width:92px;flex:none}
.bench li b{flex:1;font-weight:500}
.spark{display:flex;align-items:flex-end;gap:5px;height:90px;background:var(--panel);border-radius:var(--r-md);padding:12px}
.spark i{flex:1;background:var(--panel2);border-radius:4px 4px 0 0;min-height:4px}
.spark i.hit{background:var(--mint)}
.spark i.cur{outline:2px solid var(--amber);outline-offset:1px}
.plain{padding-left:18px;margin:8px 0}
.plain li{margin:6px 0}
.plain small{color:var(--dust)}
.onboard h2{margin-top:26px}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(27,42,71,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{background:none;border:0;min-height:62px;color:var(--dust);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#tabs button svg{width:24px;height:24px}
#tabs button[aria-current=page]{color:var(--amber)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:40;background:var(--chalk);color:var(--mat);padding:12px 18px;border-radius:24px;font-weight:600;max-width:90vw;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="rest" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
<div id="tabs">
  <nav aria-label="Main">
    <button data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21v-6M16 21v-6M8 15h8M12 15V5M10 3h4"/><circle cx="12" cy="17.5" r="1.5"/></svg>Today</button>
    <button data-go="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V14M10 20V9M16 20V12M22 20V4"/></svg>Progress</button>
    <button data-go="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
    <button data-go="program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Program</button>
  </nav>
</div>
<script>
/* ==========================================================================
   APP ENGINE — program-agnostic. Programs register themselves below.
   ========================================================================== */
'use strict';
const PROGRAMS = {};
function registerProgram(p) { PROGRAMS[p.id] = p; }

const STORE_KEY = 'handstand-app.v1';
const IMPL_NOTES = [
  'Rest timer: the manual gives no rest times, only "rest longer while learning". The default here is adjustable.',
  'Targets: the full range from the manual is shown. The suggested number moves from the low end in weeks 1–2 to the high end in weeks 3–4.',
  'Paired letters (C1/C2) are run back to back.',
  'Scheduling: the next session alternates A and B, which gives ABA/BAB at 3×/week and ABAB at 4×/week. It is not tied to weekdays, so missed days never break anything.',
  'A phase counts as done after 4 weeks of sessions at your chosen frequency. You can repeat a week or a phase any time.',
  'The assessment and exit criteria are the manual\'s own; the checkboxes are yours to tick honestly.'
];

/* ---------- state ---------- */
function freshState() {
  return {
    version: 1,
    onboarded: false,
    settings: { restSec: 90, leadIn: 3 },
    enroll: {
      programId: 'push', templateId: 'flexible', phase: 1, done: 0, freq: 3,
      addOns: { kickup: false, shoulder: false, wrist: false, pike: false },
      flexCount: { shoulder: 0, wrist: 0, pike: 0 },
      startedAt: new Date().toISOString()
    },
    active: null,
    sessions: [],
    benchmarks: [],
    criteria: {},
    lastBackup: null
  };
}
let S;
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    S = raw ? Object.assign(freshState(), JSON.parse(raw)) : freshState();
  } catch (e) { S = freshState(); }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save. Download a backup from Program.'); }
}
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }

/* ---------- helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const rng = a => Array.isArray(a) ? (a[0] === a[1] ? `${a[0]}` : `${a[0]}–${a[1]}`) : `${a}`;
const lo = a => Array.isArray(a) ? a[0] : a;
const hi = a => Array.isArray(a) ? a[1] : a;
const fmtSec = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m ? `${m}:${String(s % 60).padStart(2, '0')}` : `${s}s`; };
const clock = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const dayMs = 86400000;
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const prog = () => PROGRAMS[S.enroll.programId];
const tpl = (id = S.enroll.templateId) => prog().templates[id];
const drill = id => prog().drills[id];

function prescription(b) {
  const sets = b.sets != null ? rng(b.sets) : null;
  const side = b.perSide ? ' per side' : '';
  if (b.check) return 'As long as you need';
  if (b.block) return `About ${b.block} min`;
  if (b.balance) return `${rng(b.balance)} min total in balance`;
  if (b.total) return `${rng(b.total)} total reps${side}`;
  if (b.max) return `${sets} × max hold`;
  if (b.hold) return `${sets} × ${rng(b.hold)}s`;
  if (b.reps) return (hi(b.reps) === 1 ? `${sets} attempts` : `${sets} × ${rng(b.reps)}${side}`);
  if (b.iso) return `${sets} sets of ${b.iso}`;
  return `${sets} sets`;
}
function blockType(b) {
  if (b.check) return 'check';
  if (b.block) return 'block';
  if (b.balance) return 'balance';
  if (b.total) return 'total';
  if (b.max || b.hold) return 'hold';
  if (b.reps) return 'reps';
  return 'sets';
}
function suggestion(range, week) {
  if (!Array.isArray(range)) return range;
  const [a, z] = range; if (a === z) return a;
  const t = Math.min(1, Math.max(0, (week - 1) / 3));
  return Math.round(a + (z - a) * t);
}

/* ---------- schedule ---------- */
function perPhase() { return S.enroll.freq * 4; }
function currentWeek() { return Math.min(4, Math.floor(S.enroll.done / S.enroll.freq) + 1); }
function nextDay() { return S.enroll.done % 2 === 0 ? 'A' : 'B'; }
function phaseComplete() { return S.enroll.done >= perPhase(); }
function mainBlocks(templateId, phase, day) {
  const t = prog().templates[templateId];
  let blocks = t.phases[phase - 1][day].map((b, i) => ({ ...b, key: `m${i}` }));
  const ku = prog().addons.kickup;
  if (S.enroll.addOns.kickup && !ku.notFor.includes(templateId)) {
    blocks = ku.blocks.map((b, i) => ({ ...b, key: `k${i}`, addon: 'kickup' })).concat(blocks.filter(b => b.d !== 'wrist-warmup'));
  }
  return blocks;
}
function flexDay(id) {
  const days = Object.keys(prog().addons[id].days);
  return days[S.enroll.flexCount[id] % days.length];
}
function blocksFor(a) {
  if (a.kind === 'flex') return prog().addons[a.addon].days[a.day].map((b, i) => ({ ...b, key: `f${i}` }));
  return mainBlocks(a.templateId, a.phase, a.day);
}

/* ---------- completion ---------- */
function blockLog(key) { return S.active.logs[key] || (S.active.logs[key] = { sets: [], total: 0, clean: 0, holds: [], done: false }); }
function isBlockDone(b, L) {
  if (!L) return false;
  if (L.skipped) return true;
  switch (blockType(b)) {
    case 'check': case 'block': return !!L.done;
    case 'total': return L.total >= lo(b.total) || L.done;
    case 'balance': return L.holds.reduce((s, h) => s + h, 0) >= lo(b.balance) * 60 || L.done;
    default: return L.sets.length >= lo(b.sets) || L.done;
  }
}

/* ---------- navigation ---------- */
let view = 'today';
let openBlock = null;
let sheet = null;
function go(v) { view = v; sheet = null; render(); window.scrollTo(0, 0); }

/* ---------- rendering ---------- */
function render() {
  const app = $('#app');
  if (!S.onboarded) { app.innerHTML = renderOnboard(); $('#tabs').hidden = true; return; }
  $('#tabs').hidden = view === 'session';
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.go === view ? 'page' : 'false'));
  app.innerHTML = ({ today: renderToday, session: renderSession, progress: renderProgress, history: renderHistory, program: renderProgram })[view]();
  renderSheet();
  renderRest();
}

function renderOnboard() {
  const p = prog();
  const opts = Object.entries(p.templates).map(([id, t]) => `
    <label class="choice">
      <input type="radio" name="ob-tpl" value="${id}" ${id === S.enroll.templateId ? 'checked' : ''}>
      <span><b>${esc(t.name)}</b><small>${esc(t.who)}</small></span>
    </label>`).join('');
  return `
  <section class="onboard">
    <h1 class="display">Handstand</h1>
    <p class="lede">${esc(p.source)} ${esc(p.name)}, set up so you can open it and train.</p>
    <h2>Starting template</h2>
    <div class="choices">${opts}</div>
    <h2>Sessions per week</h2>
    ${freqPicker('ob-freq')}
    <p class="hint">The manual suggests starting at 3 and moving to 4 when time allows. 2 still works.</p>
    <h2>Add-ons</h2>
    <label class="toggle"><input type="checkbox" id="ob-pike"> <span>Pike flexibility<small>Can start right away</small></span></label>
    <p class="hint">Shoulder and wrist flexibility are suggested after your first 4 weeks. Turn them on in Program later.</p>
    <button class="primary big" data-act="onboard">Start training</button>
  </section>`;
}
function freqPicker(name) {
  return `<div class="seg" role="radiogroup">${[2, 3, 4].map(n => `
    <label><input type="radio" name="${name}" value="${n}" ${S.enroll.freq === n ? 'checked' : ''}><span>${n}×</span></label>`).join('')}</div>`;
}

function weekStrip() {
  const f = S.enroll.freq, done = S.enroll.done;
  let h = '';
  for (let w = 0; w < 4; w++) {
    let pips = '';
    for (let i = 0; i < f; i++) {
      const n = w * f + i;
      pips += `<i class="${n < done ? 'on' : n === done ? 'now' : ''}">${n % 2 === 0 ? 'A' : 'B'}</i>`;
    }
    h += `<div class="wk ${w + 1 === currentWeek() && !phaseComplete() ? 'cur' : ''}"><span>Wk ${w + 1}</span><div>${pips}</div></div>`;
  }
  return `<div class="weeks">${h}</div>`;
}

function renderToday() {
  const t = tpl(), e = S.enroll;
  let hero;
  if (S.active) {
    const a = S.active, blocks = blocksFor(a);
    const d = blocks.filter(b => isBlockDone(b, a.logs[b.key])).length;
    const title = a.kind === 'flex' ? `${prog().addons[a.addon].name}` : `Day ${a.day}`;
    hero = `
      <div class="hero">
        <p class="kicker">In progress since ${new Date(a.startedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</p>
        <h1 class="display ${title.length > 6 ? 'long' : ''}">${esc(title)}</h1>
        <p class="sub">${d} of ${blocks.length} done</p>
        <button class="primary big" data-act="resume">Resume session</button>
        <button class="ghost" data-act="discard">Discard session</button>
      </div>`;
  } else if (phaseComplete()) {
    hero = `
      <div class="hero">
        <p class="kicker">${esc(t.name)}</p>
        <h1 class="display long">Phase ${e.phase} done</h1>
        ${e.phase === 1
          ? `<p class="sub">Four weeks in. Move to phase 2, or repeat phase 1 if it still feels like a stretch.</p>
             <button class="primary big" data-act="phase" data-v="2">Start phase 2</button>
             <button class="ghost" data-act="phase" data-v="1">Repeat phase 1</button>`
          : `<p class="sub">Eight weeks in. Time to reassess: check your progress list, then move on or repeat phase 2.</p>
             <button class="primary big" data-go="progress">Reassess</button>
             <button class="ghost" data-act="phase" data-v="2">Repeat phase 2</button>`}
      </div>`;
  } else {
    const day = nextDay(), blocks = mainBlocks(e.templateId, e.phase, day);
    const names = blocks.filter(b => b.d !== 'wrist-warmup').map(b => drill(b.d).name);
    hero = `
      <div class="hero">
        <p class="kicker">${esc(t.name)}, phase ${e.phase}, week ${currentWeek()}</p>
        <h1 class="display">Day ${day}</h1>
        <p class="sub">${blocks.length} exercises: ${esc(names.slice(0, 3).join(', '))}${names.length > 3 ? ` and ${names.length - 3} more` : ''}</p>
        <button class="primary big" data-act="start" data-kind="main">Start Day ${day}</button>
      </div>`;
  }
  const flex = Object.entries(prog().addons).filter(([id, a]) => a.kind === 'flex' && e.addOns[id]);
  const weekAgo = Date.now() - 7 * dayMs;
  const flexCards = flex.map(([id, a]) => {
    const n = S.sessions.filter(s => s.kind === 'flex' && s.addon === id && Date.parse(s.date) > weekAgo).length;
    const day = flexDay(id);
    return `<div class="row-card">
      <div><b>${esc(a.name)}${Object.keys(a.days).length > 1 ? `, day ${day}` : ''}</b><small>${n} of 2 this week</small></div>
      <button class="secondary" data-act="start" data-kind="flex" data-addon="${id}" ${S.active ? 'disabled' : ''}>Start</button>
    </div>`;
  }).join('');
  const last = S.sessions[S.sessions.length - 1];
  return `
    <section class="today">
      ${hero}
      ${S.active || phaseComplete() ? '' : weekStrip()}
      ${flexCards ? `<h2>Extra sessions</h2>${flexCards}` : ''}
      ${last ? `<h2>Last session</h2>
        <button class="row-card link" data-act="open-history" data-id="${last.id}">
          <div><b>${esc(sessionTitle(last))}</b><small>${fmtDate(last.date)}${last.notes ? `: ${esc(last.notes.slice(0, 60))}` : ''}</small></div>
        </button>` : ''}
    </section>`;
}
function sessionTitle(s) {
  if (s.kind === 'flex') return prog().addons[s.addon]?.name || 'Flexibility';
  if (s.kind === 'test') return 'Kick-up test';
  const t = PROGRAMS[s.programId]?.templates[s.templateId];
  return `Day ${s.day}, ${t ? t.name : s.templateId}, P${s.phase} W${s.week}`;
}

/* ---------- session ---------- */
function renderSession() {
  const a = S.active;
  if (!a) { view = 'today'; return renderToday(); }
  const blocks = blocksFor(a);
  const doneCount = blocks.filter(b => isBlockDone(b, a.logs[b.key])).length;
  if (openBlock === null) {
    const first = blocks.find(b => !isBlockDone(b, a.logs[b.key]));
    openBlock = first ? first.key : null;
  }
  const title = a.kind === 'flex' ? prog().addons[a.addon].name : `Day ${a.day}`;
  const kuNote = blocks.some(b => b.addon === 'kickup') ? `<p class="note inline">${esc(prog().addons.kickup.note)}</p>` : '';
  let lastSection = null;
  const cards = blocks.map(b => {
    let head = '';
    const sec = b.addon === 'kickup' ? 'ku' : 'main';
    if (b.addon === 'kickup' && lastSection !== 'ku') head = `<h2 class="group">Kick-Up Mastery</h2>${kuNote}`;
    if (!b.addon && lastSection === 'ku') head = `<h2 class="group">Main session</h2>`;
    lastSection = sec;
    return head + renderBlock(b, a);
  }).join('');
  return `
    <section class="session">
      <header class="session-bar">
        <button class="icon" data-go="today" aria-label="Back to today">‹</button>
        <div><b>${esc(title)}</b><small>${doneCount}/${blocks.length} done</small></div>
        <button class="secondary small" data-act="finish-open">Finish</button>
      </header>
      <div class="meter"><i style="width:${(doneCount / blocks.length) * 100}%"></i></div>
      ${cards}
      <button class="primary big" data-act="finish-open">Finish session</button>
    </section>`;
}

function renderBlock(b, a) {
  const d = drill(b.d), L = a.logs[b.key], done = isBlockDone(b, L), open = openBlock === b.key;
  const sec = prog().sections[d.s];
  const week = a.week || 1;
  return `
  <article class="block ${done ? 'done' : ''} ${open ? 'open' : ''}" id="blk-${b.key}">
    <button class="block-head" data-act="toggle-block" data-key="${b.key}" aria-expanded="${open}">
      <span class="ord">${esc(b.o.replace(/^K/, ''))}</span>
      <span class="bt"><b>${esc(d.name)}</b><small>${esc(prescription(b))}${b.opt ? ', optional' : ''}</small></span>
      <span class="tick" aria-hidden="true">${done ? (L && L.skipped ? '–' : '✓') : ''}</span>
    </button>
    ${open ? `<div class="block-body">
      ${b.note ? `<p class="note">${esc(b.note)}</p>` : ''}
      ${logUI(b, L, week)}
      <details class="about"><summary>How to</summary>
        <p>${esc(d.sum)}</p>
        ${b.flag ? `<p class="flag">App note: ${esc(b.flag)}</p>` : ''}

      </details>

        ${sec && sec.url ? `<a class="secondary small" href="${esc(d.video || sec.url)}" target="_blank" rel="noopener">Watch video</a>` : ''}
        ${!done ? `<button class="ghost small" data-act="skip" data-key="${b.key}">Skip</button>` : ''}
        ${done ? `<button class="ghost small" data-act="next-block" data-key="${b.key}">Next exercise</button>` : ''}
      </div>
    </div>` : ''}
  </article>`;
}

function logUI(b, L, week) {
  L = L || { sets: [], total: 0, clean: 0, holds: [], done: false };
  const t = blockType(b), k = b.key;
  if (t === 'check') {
    return `<button class="primary wide" data-act="check" data-key="${k}">${L.done ? 'Done ✓' : 'Mark done'}</button>`;
  }
  if (t === 'block') {
    return `<div class="blocktimer">
      <button class="primary wide" data-act="block-timer" data-key="${k}" data-min="${b.block}">Start ${b.block}-minute timer</button>
      <input class="field" data-act="block-note" data-key="${k}" placeholder="What did you work on?" value="${esc(L.what || '')}">
      <button class="${L.done ? 'secondary' : 'ghost'} wide" data-act="check" data-key="${k}">${L.done ? 'Done ✓' : 'Mark done'}</button>
    </div>`;
  }
  if (t === 'total') {
    const target = suggestion(b.total, week), pct = Math.min(100, (L.total / hi(b.total)) * 100);
    return `<div class="counter">
      <div class="count"><span class="num">${L.total}</span><small>of ${rng(b.total)}${b.perSide ? ' per side' : ''}. Aim for ${target} this week.</small></div>
      <div class="bar"><i style="width:${pct}%"></i><em style="left:${(lo(b.total) / hi(b.total)) * 100}%"></em></div>
      <div class="pad">
        <button data-act="count" data-key="${k}" data-n="-1" aria-label="Minus one">−1</button>
        <button data-act="count" data-key="${k}" data-n="1">+1</button>
        <button data-act="count" data-key="${k}" data-n="5">+5</button>
      </div>
      ${b.count ? `<div class="clean"><span>Clean holds landed: <b>${L.clean}</b></span>
        <button data-act="clean" data-key="${k}" data-n="-1" aria-label="Minus one clean">−</button>
        <button data-act="clean" data-key="${k}" data-n="1" aria-label="Plus one clean">+</button></div>` : ''}
    </div>`;
  }
  if (t === 'balance') {
    const tot = L.holds.reduce((s, h) => s + h, 0), best = Math.max(0, ...L.holds);
    return `<div class="counter">
      <div class="count"><span class="num">${clock(tot)}</span><small>in balance of ${rng(b.balance)} min. ${L.holds.length} holds, best ${fmtSec(best)}.</small></div>
      <div class="bar"><i style="width:${Math.min(100, tot / (hi(b.balance) * 60) * 100)}%"></i><em style="left:${lo(b.balance) / hi(b.balance) * 100}%"></em></div>
      <button class="primary wide" data-act="hold" data-key="${k}" data-mode="balance">Time a hold</button>
      ${L.holds.length ? `<p class="chips">${L.holds.map((h, i) => `<button class="chip" data-act="del-hold" data-key="${k}" data-i="${i}" aria-label="Remove ${h} second hold">${fmtSec(h)} ×</button>`).join('')}</p>` : ''}
    </div>`;
  }
  // set-based: hold, reps, sets(iso/attempts)
  const maxSets = hi(b.sets), minSets = lo(b.sets);
  const chips = [];
  for (let i = 0; i < maxSets; i++) {
    const v = L.sets[i];
    const label = v == null ? `Set ${i + 1}` : t === 'hold' ? fmtSec(v) : t === 'reps' && hi(b.reps) > 1 ? `${v} reps` : 'Done';
    chips.push(`<button class="set ${v != null ? 'logged' : ''} ${i >= minSets ? 'extra' : ''}" data-act="set" data-key="${k}" data-i="${i}">${label}</button>`);
  }
  const hint = t === 'hold'
    ? (b.max ? 'Tap a set to time a max hold.' : `Tap a set to time it. Aim for ${suggestion(b.hold, week)}s this week.`)
    : t === 'reps' && hi(b.reps) > 1 ? `Tap a set to log it. Aim for ${suggestion(b.reps, week)}${b.perSide ? ' per side' : ''}.`
    : 'Tap a set when it is done.';
  return `<p class="hint">${hint}${maxSets > minSets ? ` Sets past ${minSets} are optional.` : ''}</p><div class="sets">${chips.join('')}</div>`;
}

/* ---------- sheets (timer, reps, finish, history detail) ---------- */
let timer = null;   // {mode, key, i, start, lead, elapsed, running}
let rest = null;    // {end, total}
let blockT = null;  // {key, end, paused, remain}
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S && S.active) keepAwake(); });

let audioCtx;
function beep(freq = 880, dur = 0.15, times = 1) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let n = 0; n < times; n++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + n * (dur + 0.08);
      g.gain.setValueAtTime(0.25, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.start(t0); o.stop(t0 + dur);
    }
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(120 * times);
}

function renderSheet() {
  let el = $('#sheet');
  if (!sheet) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `<div class="scrim" data-act="close-sheet"></div><div class="panel" role="dialog" aria-modal="true">${sheetBody()}</div>`;
}
function sheetBody() {

      <div class="bigclock">${sheet.value}</div>
      <div class="pad"><button data-act="reps-adj" data-n="-1">−1</button><button data-act="reps-adj" data-n="1">+1</button></div>
      <button class="primary big" data-act="reps-save">Save set</button>
      ${S.active.logs[sheet.key]?.sets[sheet.i] != null ? `<button class="ghost" data-act="set-clear">Clear this set</button>` : ''}

    const wrists = ['Fresh', 'Fine', 'Niggly', 'Sore'].map(w => `<button class="${f.wrist === w ? 'on' : ''}" data-act="fin" data-f="wrist" data-v="${w}">${w}</button>`).join('');
    return `<h3>Finish session</h3>

      <button class="primary big" data-act="finish-save">Save session</button>

      ${s.notes ? `<p class="notes">${esc(s.notes)}</p>` : ''}
      <ul class="results">${rows}</ul>

  if (sheet.type === 'bench') {

        <div class="split">

          <div><p class="label">Right leg</p><div class="bigclock">${f.right}</div><div class="pad"><button data-act="bench-adj" data-f="right" data-n="-1">−</button><button data-act="bench-adj" data-f="right" data-n="1">+</button></div></div>
        </div>
        <button class="primary big" data-act="bench-save">Save test</button>
        <button class="ghost" data-act="close-sheet">Cancel</button>`;
    }
    return `<h3>${f.kind === 'ctw' ? 'Chest-to-wall max hold' : 'Freestanding max hold'}</h3>
      <p class="sub">Enter your best hold in seconds.</p>
      <div class="bigclock">${fmtSec(f.value)}</div>
      <div class="pad"><button data-act="bench-adj" data-f="value" data-n="-5">−5</button><button data-act="bench-adj" data-f="value" data-n="-1">−1</button><button data-act="bench-adj" data-f="value" data-n="1">+1</button><button data-act="bench-adj" data-f="value" data-n="5">+5</button></div>
      <button class="primary big" data-act="bench-save">Save</button>
      <button class="ghost" data-act="close-sheet">Cancel</button>`;
  }
  if (sheet.type === 'restore') {
    return `<h3>Restore a backup</h3>
      <p class="sub">Choose a backup file, or paste a backup code. This replaces everything currently in the app.</p>
      <input type="file" id="restore-file" accept="application/json,.json,.txt" class="field">
      <textarea class="field" id="restore-text" rows="5" placeholder="Paste backup code"></textarea>
      <button class="primary big" data-act="restore-go">Restore</button>
      <button class="ghost" data-act="close-sheet">Cancel</button>`;
  }
  return '';
}

function tick() {
  const now = Date.now();
  if (timer && sheet && sheet.type === 'timer') {
    const el = $('#tclock');
    if (timer.stage === 'lead') {
      const left = Math.ceil((timer.leadEnd - now) / 1000);
      if (left <= 0) { timer.stage = 'run'; timer.start = now; beep(1320, 0.2); renderSheet(); }
      else { if (el) el.textContent = left; if (left !== timer.lastLead) { timer.lastLead = left; beep(660, 0.08); } }
    } else if (timer.stage === 'run' && el) {
      const s = (now - timer.start) / 1000;
      el.textContent = fmtSec(s);
      const b = blocksFor(S.active).find(x => x.key === timer.key);
      if (b && b.hold && !b.max && !timer.hitLow && s >= lo(b.hold)) { timer.hitLow = true; beep(990, 0.12); }
      if (b && b.hold && !b.max && !timer.hitHigh && s >= hi(b.hold)) { timer.hitHigh = true; beep(990, 0.12, 2); }
    }
  }
  if (rest) {
    const left = Math.ceil((rest.end - now) / 1000);
    const el = $('#rest-left');
    if (left <= 0) { beep(880, 0.18, 3); rest = null; renderRest(); }
    else if (el) { el.textContent = clock(left); $('#rest-bar').style.width = `${(left / rest.total) * 100}%`; }
  }
  if (blockT && !blockT.paused) {
    const left = Math.ceil((blockT.end - now) / 1000);
    const el = $('#block-left');
    if (left <= 0) { beep(880, 0.25, 3); const L = blockLog(blockT.key); L.done = true; save(); blockT = null; render(); }
    else if (el) el.textContent = clock(left);
  }
}
setInterval(tick, 200);

function renderRest() {
  const el = $('#rest');
  if (blockT && view === 'session') {
    el.hidden = false;
    const left = blockT.paused ? blockT.remain : Math.ceil((blockT.end - Date.now()) / 1000);
    el.innerHTML = `<div class="rest-inner"><span class="rl">Timer</span><span class="rt" id="block-left">${clock(left)}</span>
      <button data-act="block-pause">${blockT.paused ? 'Resume' : 'Pause'}</button><button data-act="block-stop">Stop</button></div>`;
    return;
  }
  if (!rest || view !== 'session') { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const left = Math.ceil((rest.end - Date.now()) / 1000);
  el.innerHTML = `<div class="rest-bar" id="rest-bar" style="width:${(left / rest.total) * 100}%"></div>
    <div class="rest-inner"><span class="rl">Rest</span><span class="rt" id="rest-left">${clock(left)}</span>
    <button data-act="rest-adj" data-n="-15">−15</button><button data-act="rest-adj" data-n="15">+15</button><button data-act="rest-skip">Skip</button></div>`;
}
function startRest() { const t = S.settings.restSec; if (!t) return; rest = { end: Date.now() + t * 1000, total: t }; renderRest(); }

/* ---------- actions ---------- */
function startSession(kind, addon) {
  const e = S.enroll;
  S.active = kind === 'flex'
    ? { id: uid(), kind, addon, day: flexDay(addon), startedAt: new Date().toISOString(), logs: {}, week: 1 }
    : { id: uid(), kind: 'main', programId: e.programId, templateId: e.templateId, phase: e.phase, day: nextDay(), week: currentWeek(), startedAt: new Date().toISOString(), logs: {} };
  openBlock = null; save(); keepAwake(); go('session');
}
function summarize(a) {
  return blocksFor(a).map(b => {
    const L = a.logs[b.key], t = blockType(b), name = `${b.o.replace(/^K/, 'KU ')} ${drill(b.d).name}`;
    let result = 'Not done';
    if (L && L.skipped) result = 'Skipped';
    else if (L) {
      if (t === 'check' || t === 'block') result = L.done ? (L.what ? `Done: ${L.what}` : 'Done') : 'Not done';
      else if (t === 'total') result = `${L.total} reps${b.count ? `, ${L.clean} clean` : ''}`;
      else if (t === 'balance') result = L.holds.length ? `${fmtSec(L.holds.reduce((s, h) => s + h, 0))} total, best ${fmtSec(Math.max(...L.holds))}` : 'Not done';
      else if (t === 'hold') result = L.sets.filter(v => v != null).map(fmtSec).join(', ') || 'Not done';
      else if (t === 'reps' && hi(b.reps) > 1) result = L.sets.filter(v => v != null).join(', ') || 'Not done';
      else result = `${L.sets.filter(v => v != null).length} sets`;
    }
    return { d: b.d, name, result };
  });
}
function finishSession(f) {
  const a = S.active;
  const rec = {
    id: a.id, kind: a.kind, addon: a.addon, programId: a.programId, templateId: a.templateId, phase: a.phase, day: a.day, week: a.week,
    date: new Date().toISOString(), startedAt: a.startedAt,
    minutes: Math.round((Date.now() - Date.parse(a.startedAt)) / 60000),
    energy: f.energy || null, wrist: f.wrist || null, notes: f.notes || '',
    logs: a.logs, summary: summarize(a)
  };
  S.sessions.push(rec);
  if (a.kind === 'flex') S.enroll.flexCount[a.addon] = (S.enroll.flexCount[a.addon] || 0) + 1;
  else if (a.templateId === S.enroll.templateId && a.phase === S.enroll.phase) S.enroll.done++;
  S.active = null; rest = null; blockT = null; openBlock = null;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  save(); go('today'); toast('Session saved');
}

function onClick(ev) {
  const t = ev.target.closest('[data-act],[data-go]');
  if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  const act = t.dataset.act, k = t.dataset.key;
  const A = S.active;
  switch (act) {
    case 'onboard': {
      S.enroll.templateId = (document.querySelector('input[name=ob-tpl]:checked') || {}).value || 'flexible';
      S.enroll.freq = +((document.querySelector('input[name=ob-freq]:checked') || {}).value || 3);
      S.enroll.addOns.pike = $('#ob-pike').checked;
      S.enroll.startedAt = new Date().toISOString();
      S.onboarded = true; save(); go('today'); break;
    }
    case 'start': startSession(t.dataset.kind, t.dataset.addon); break;
    case 'resume': openBlock = null; keepAwake(); go('session'); break;
    case 'discard': if (confirm('Discard this session? Nothing from it will be saved.')) { S.active = null; rest = null; blockT = null; save(); render(); } break;
    case 'phase': S.enroll.phase = +t.dataset.v; S.enroll.done = 0; save(); render(); toast(`Phase ${t.dataset.v} started`); break;
    case 'toggle-block': openBlock = openBlock === k ? '' : k; render(); document.getElementById(`blk-${k}`)?.scrollIntoView({ block: 'nearest' }); break;
    case 'next-block': nextBlock(k); break;
    case 'check': { const L = blockLog(k); L.done = !L.done; save(); render(); break; }
    case 'skip': { const L = blockLog(k); L.skipped = true; save(); nextBlock(k); break; }
    case 'count': { const L = blockLog(k); L.total = Math.max(0, L.total + +t.dataset.n); save(); render(); break; }
    case 'clean': { const L = blockLog(k); L.clean = Math.max(0, L.clean + +t.dataset.n); save(); render(); break; }
    case 'set': {
      const b = blocksFor(A).find(x => x.key === k), i = +t.dataset.i, L = blockLog(k), ty = blockType(b);
      if (ty === 'hold') { timer = { key: k, i, stage: 'ready', mode: 'set' }; sheet = { type: 'timer' }; rest = null; renderSheet(); renderRest(); }
      else if (ty === 'reps' && hi(b.reps) > 1) { sheet = { type: 'reps', key: k, i, value: L.sets[i] ?? suggestion(b.reps, A.week || 1) }; renderSheet(); }
      else if (L.sets[i] != null) { L.sets.splice(i, 1); save(); render(); }
      else { L.sets[L.sets.length] = 1; save(); startRest(); afterLog(k); }
      break;
    }
    case 'hold': timer = { key: k, stage: 'ready', mode: 'balance' }; sheet = { type: 'timer' }; rest = null; renderSheet(); renderRest(); break;
    case 'del-hold': { const L = blockLog(k); L.holds.splice(+t.dataset.i, 1); save(); render(); break; }
    case 'timer-tap': {
      if (timer.stage === 'ready') {
        keepAwake(); beep(0, 0.01);
        const lead = S.settings.leadIn || 0;
        if (lead) { timer.stage = 'lead'; timer.leadEnd = Date.now() + lead * 1000; }
        else { timer.stage = 'run'; timer.start = Date.now(); }
        renderSheet();
      } else if (timer.stage === 'run') {
        timer.value = Math.round((Date.now() - timer.start) / 1000); timer.stage = 'confirm'; renderSheet();
      }
      break;
    }
    case 'timer-clear': { const L = blockLog(timer.key); L.sets.splice(timer.i, 1); save(); sheet = null; timer = null; render(); break; }
    case 'timer-manual': timer.value = 30; timer.stage = 'confirm'; renderSheet(); break;
    case 'adj': timer.value = Math.max(0, timer.value + +t.dataset.n); renderSheet(); break;
    case 'timer-save': {
      const L = blockLog(timer.key);
      if (timer.mode === 'balance') L.holds.push(timer.value);
      else { L.sets[Math.min(timer.i, L.sets.length)] = timer.value; }
      const tk = timer.key; save(); sheet = null; timer = null; startRest(); afterLog(tk); break;
    }
    case 'reps-adj': sheet.value = Math.max(0, sheet.value + +t.dataset.n); renderSheet(); break;
    case 'reps-save': { const L = blockLog(sheet.key), tk = sheet.key; L.sets[Math.min(sheet.i, L.sets.length)] = sheet.value; save(); sheet = null; startRest(); afterLog(tk); break; }
    case 'set-clear': { const L = blockLog(sheet.key); L.sets.splice(sheet.i, 1); save(); sheet = null; render(); break; }
    case 'close-sheet': sheet = null; timer = null; renderSheet(); break;
    case 'rest-adj': if (rest) { rest.end += +t.dataset.n * 1000; rest.total = Math.max(rest.total, Math.ceil((rest.end - Date.now()) / 1000)); } break;
    case 'rest-skip': rest = null; renderRest(); break;
    case 'block-timer': blockT = { key: k, end: Date.now() + +t.dataset.min * 60000 }; rest = null; keepAwake(); beep(0, 0.01); renderRest(); break;
    case 'block-pause':
      if (blockT.paused) { blockT.end = Date.now() + blockT.remain * 1000; blockT.paused = false; }
      else { blockT.remain = Math.ceil((blockT.end - Date.now()) / 1000); blockT.paused = true; }
      renderRest(); break;
    case 'block-stop': blockT = null; renderRest(); break;
    case 'finish-open': sheet = { type: 'finish' }; renderSheet(); break;
    case 'fin': sheet.notes = $('#fin-notes').value; sheet[t.dataset.f] = t.dataset.f === 'energy' ? +t.dataset.v : t.dataset.v; renderSheet(); break;
    case 'finish-save': sheet.notes = $('#fin-notes').value; { const f = sheet; sheet = null; finishSession(f); } break;
    case 'open-history': sheet = { type: 'history', id: t.dataset.id }; renderSheet(); break;
    case 'del-session': if (confirm('Delete this session from history?')) {
      const s = S.sessions.find(x => x.id === t.dataset.id);
      S.sessions = S.sessions.filter(x => x.id !== t.dataset.id);
      if (s && s.kind === 'main' && s.templateId === S.enroll.templateId && s.phase === S.enroll.phase && Date.parse(s.date) > Date.parse(S.enroll.phaseStart || S.enroll.startedAt)) S.enroll.done = Math.max(0, S.enroll.done - 1);
      save(); sheet = null; render();
    } break;
    case 'crit': { const tid = t.dataset.tpl; S.criteria[tid] = S.criteria[tid] || {}; S.criteria[tid][t.dataset.i] = t.checked; save(); render(); break; }
    case 'bench-open': sheet = { type: 'bench', kind: t.dataset.kind, left: 5, right: 5, value: 30 }; renderSheet(); break;
    case 'bench-adj': { const f = t.dataset.f, max = f === 'value' ? 3600 : 10; sheet[f] = Math.min(max, Math.max(0, sheet[f] + +t.dataset.n)); renderSheet(); break; }
    case 'bench-save': {
      const f = sheet;
      S.benchmarks.push(f.kind === 'kickup' ? { id: uid(), date: new Date().toISOString(), kind: 'kickup', left: f.left, right: f.right } : { id: uid(), date: new Date().toISOString(), kind: f.kind, value: f.value });
      save(); sheet = null; render(); toast('Benchmark saved'); break;
    }
    case 'del-bench': S.benchmarks = S.benchmarks.filter(b => b.id !== t.dataset.id); save(); render(); break;

    case 'set-phase': S.enroll.phase = +t.dataset.v; S.enroll.done = 0; S.enroll.phaseStart = new Date().toISOString(); save(); render(); toast(`Phase ${t.dataset.v}, week 1`); break;
    case 'repeat-week': S.enroll.done = (currentWeek() - 1) * S.enroll.freq; save(); render(); toast(`Week ${currentWeek()} restarted`); break;
    case 'restart-phase': S.enroll.done = 0; S.enroll.phaseStart = new Date().toISOString(); save(); render(); toast('Phase restarted'); break;
    case 'addon': S.enroll.addOns[t.dataset.id] = t.checked; save(); render(); break;
    case 'rest-set': S.settings.restSec = +t.dataset.v; save(); render(); break;
    case 'lead-set': S.settings.leadIn = +t.dataset.v; save(); render(); break;
    case 'backup-file': backupFile(); break;
    case 'backup-copy': backupCopy(); break;
    case 'restore-open': sheet = { type: 'restore' }; renderSheet(); break;
    case 'restore-go': restore(); break;
    case 'reset': if (confirm('Erase all training data? Download a backup first if you want to keep it.') && confirm('Really erase everything?')) { localStorage.removeItem(STORE_KEY); load(); go('today'); } break;
  }
}
function onChange(ev) {
  const t = ev.target;
  if (t.name === 'freq') { S.enroll.freq = +t.value; save(); render(); }
  if (t.dataset.act === 'block-note') { blockLog(t.dataset.key).what = t.value; save(); }
  if (t.name === 'tpl') setTemplate(t.value);
}
function setTemplate(v) {
  if (v !== S.enroll.templateId && confirm(`Switch to ${tpl(v).name}? You will start at phase 1, week 1.`)) {
    S.enroll.templateId = v; S.enroll.phase = 1; S.enroll.done = 0; S.enroll.phaseStart = new Date().toISOString();
    save(); render(); toast('Template changed');
  } else render();
}
function afterLog(k) {
  const b = blocksFor(S.active).find(x => x.key === k), L = S.active.logs[k];
  if (b && L && b.sets != null && L.sets.length >= hi(b.sets)) nextBlock(k); else render();
}
function nextBlock(k) {
  const A = S.active, bl = blocksFor(A), i = bl.findIndex(b => b.key === k);
  const nxt = bl.slice(i + 1).find(b => !isBlockDone(b, A.logs[b.key])) || bl.find(b => !isBlockDone(b, A.logs[b.key]));
  openBlock = nxt ? nxt.key : ''; render();
  if (nxt) document.getElementById(`blk-${nxt.key}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- progress ---------- */
function bests() {
  let ctw = 0, free = 0, balance = 0;
  const main = S.sessions.filter(s => s.logs);
  for (const s of main) {
    for (const [key, L] of Object.entries(s.logs)) {
      const b = (s.kind === 'flex' ? [] : safeBlocks(s)).find(x => x.key === key);
      if (!b) continue;
      if (b.d === 'ctw-hold') ctw = Math.max(ctw, ...L.sets.filter(v => v != null), 0);
      if (b.d === 'freestanding-hold') {
        if (b.balance) { free = Math.max(free, ...L.holds, 0); balance = Math.max(balance, L.holds.reduce((x, y) => x + y, 0)); }
        else free = Math.max(free, ...L.sets.filter(v => v != null), 0);
      }
    }
  }
  for (const b of S.benchmarks) {
    if (b.kind === 'ctw') ctw = Math.max(ctw, b.value);
    if (b.kind === 'free') free = Math.max(free, b.value);
  }
  return { ctw, free, balance };
}
function safeBlocks(s) { try { return mainBlocksRaw(s); } catch (e) { return []; } }
function mainBlocksRaw(s) {
  const p = PROGRAMS[s.programId]; const t = p.templates[s.templateId];
  const main = t.phases[s.phase - 1][s.day].map((b, i) => ({ ...b, key: `m${i}` }));
  const ku = p.addons.kickup.blocks.map((b, i) => ({ ...b, key: `k${i}` }));
  return main.concat(ku);
}

function renderProgress() {
  const t = tpl(), e = S.enroll, b = bests();
  const now = Date.now();
  const main = S.sessions.filter(s => s.kind === 'main');
  const last28 = main.filter(s => now - Date.parse(s.date) < 28 * dayMs).length;
  const weeks = [];
  for (let w = 11; w >= 0; w--) {
    const start = now - (w + 1) * 7 * dayMs, end = now - w * 7 * dayMs;
    weeks.push(S.sessions.filter(s => s.kind !== 'test' && Date.parse(s.date) > start && Date.parse(s.date) <= end).length);
  }
  const peak = Math.max(e.freq + 2, ...weeks);
  const ku = S.benchmarks.filter(x => x.kind === 'kickup').slice(-1)[0];
  const crit = S.criteria[e.templateId] || {};
  const critDone = t.exit.filter((_, i) => crit[i]).length;
  const benchList = S.benchmarks.slice(-6).reverse().map(x => `<li><span>${fmtDate(x.date)}</span><b>${x.kind === 'kickup' ? `Kick-up test ${x.left}/10 L, ${x.right}/10 R` : `${x.kind === 'ctw' ? 'Chest-to-wall' : 'Freestanding'} ${fmtSec(x.value)}`}</b><button class="ghost small" data-act="del-bench" data-id="${x.id}" aria-label="Delete">×</button></li>`).join('');
  const phase2Done = e.phase === 2 && phaseComplete();
  return `
    <section class="progress">
      <h1 class="page">Progress</h1>
      <div class="stage">
        <p class="kicker">Current stage</p>
        <h2 class="stage-name">${esc(t.name)}</h2>
        <p class="sub">Phase ${e.phase} of 2, ${phaseComplete() ? 'complete' : `week ${currentWeek()} of 4`}. ${Math.min(e.done, perPhase())} of ${perPhase()} sessions.</p>
        <div class="meter"><i style="width:${((e.phase - 1) * perPhase() + Math.min(e.done, perPhase())) / (2 * perPhase()) * 100}%"></i></div>
        <p class="meta">Across both phases of this template</p>
      </div>

      <h2>Personal bests</h2>
      <div class="stats">
        <div><span class="num">${b.ctw ? fmtSec(b.ctw) : '–'}</span><small>Chest-to-wall hold</small></div>
        <div><span class="num">${b.free ? fmtSec(b.free) : '–'}</span><small>Freestanding hold</small></div>
        <div><span class="num">${ku ? `${ku.left}/${ku.right}` : '–'}</span><small>Kick-up test, L/R</small></div>
        <div><span class="num">${b.balance ? clock(b.balance) : '–'}</span><small>Balance time in a session</small></div>
      </div>
      <div class="btnrow">
        <button class="secondary small" data-act="bench-open" data-kind="ctw">Log chest-to-wall max</button>
        <button class="secondary small" data-act="bench-open" data-kind="free">Log freestanding max</button>
        <button class="secondary small" data-act="bench-open" data-kind="kickup">Log kick-up test</button>
      </div>
      ${benchList ? `<ul class="bench">${benchList}</ul>` : ''}

      <h2>Consistency</h2>
      <p class="sub">${last28} main session${last28 === 1 ? '' : 's'} in the last 4 weeks, against a plan of ${e.freq * 4}.</p>
      <div class="spark" aria-label="Sessions per week, last 12 weeks">${weeks.map((n, i) => `<i title="${n}" style="height:${Math.max(4, n / peak * 100)}%" class="${n >= e.freq ? 'hit' : ''}${i === 11 ? ' cur' : ''}"></i>`).join('')}</div>
      <p class="meta">Last 12 weeks. Filled bars hit your weekly plan.</p>

      <h2>Ready to move on?</h2>
      <p class="sub">${critDone} of ${t.exit.length} from the manual's criteria for ${esc(t.name)}. Next: ${esc(t.next)}.</p>
      <div class="checks">${t.exit.map((c, i) => `
        <label class="check"><input type="checkbox" data-act="crit" data-tpl="${e.templateId}" data-i="${i}" ${crit[i] ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}
      </div>
      ${critDone === t.exit.length ? `<p class="note">Everything's ticked. When you finish this phase, switch template in Program.</p>` : ''}

      <details class="about" ${phase2Done ? 'open' : ''}><summary>Eight-week reassessment questions</summary>
        <ul class="plain">${prog().reassess.map(q => `<li>${esc(q)}</li>`).join('')}</ul>
        <p class="meta">If the answers are mostly yes and the criteria above are met, move on. Otherwise repeat phase 2.</p>
      </details>
    </section>`;
}

function renderHistory() {
  const list = S.sessions.slice().reverse();
  if (!list.length) return `<section><h1 class="page">History</h1><p class="empty">Finished sessions show up here, with your notes.</p><button class="primary big" data-go="today">Go to today</button></section>`;
  let lastMonth = '';
  const rows = list.map(s => {
    const m = new Date(s.date).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const head = m !== lastMonth ? `<h2>${m}</h2>` : '';
    lastMonth = m;
    return `${head}<button class="row-card link" data-act="open-history" data-id="${s.id}">
      <div><b>${esc(sessionTitle(s))}</b><small>${fmtDate(s.date)}${s.minutes ? `, ${s.minutes} min` : ''}${s.wrist ? `, joints ${s.wrist.toLowerCase()}` : ''}${s.notes ? `. ${esc(s.notes.slice(0, 70))}` : ''}</small></div>
    </button>`;
  }).join('');
  return `<section class="history"><h1 class="page">History</h1>${rows}</section>`;
}

function renderProgram() {
  const p = prog(), e = S.enroll;
  const tpls = Object.entries(p.templates).map(([id, t]) => `
    <label class="choice"><input type="radio" name="tpl" value="${id}" ${id === e.templateId ? 'checked' : ''}>
    <span><b>${esc(t.name)}</b><small>${esc(t.who)}</small></span></label>`).join('');
  const addons = Object.entries(p.addons).map(([id, a]) => {
    const blocked = a.notFor && a.notFor.includes(e.templateId);
    return `<label class="toggle ${blocked ? 'off' : ''}"><input type="checkbox" data-act="addon" data-id="${id}" ${e.addOns[id] ? 'checked' : ''} ${blocked ? 'disabled' : ''}>
      <span>${esc(a.name)}<small>${esc(blocked ? 'Not used with Total Beginner.' : a.who)}</small></span></label>`;
  }).join('');
  const lib = Object.entries(p.sections).filter(([, s]) => s.url).map(([sid, s]) => {
    const ds = Object.values(p.drills).filter(d => d.s === sid);
    return `<details class="about"><summary>${esc(s.name)}</summary>
      <ul class="plain">${ds.map(d => `<li><b>${esc(d.name)}</b>, p. ${d.p}<br><small>${esc(d.sum)}</small></li>`).join('')}</ul>
      <a class="secondary small" href="${esc(s.url)}" target="_blank" rel="noopener">Open ${esc(s.name.toLowerCase())} videos</a></details>`;
  }).join('');
  const since = S.lastBackup ? `Last backup ${fmtDate(S.lastBackup)}.` : 'No backup yet.';
  return `
    <section class="program">
      <h1 class="page">Program</h1>
      <p class="sub">${esc(p.source)} ${esc(p.name)}. <a href="${esc(p.library)}" target="_blank" rel="noopener">Open the full video library</a></p>

      <h2>Template</h2>
      <div class="choices">${tpls}</div>

      <h2>Phase</h2>
      <div class="seg buttons">
        <button class="${e.phase === 1 ? 'on' : ''}" data-act="set-phase" data-v="1">Phase 1</button>
        <button class="${e.phase === 2 ? 'on' : ''}" data-act="set-phase" data-v="2">Phase 2</button>
      </div>
      <div class="btnrow">
        <button class="secondary small" data-act="repeat-week">Repeat this week</button>
        <button class="secondary small" data-act="restart-phase">Restart this phase</button>
      </div>

      <h2>Sessions per week</h2>
      ${freqPicker('freq')}

      <h2>Add-ons</h2>
      ${addons}

      <h2>Timers</h2>
      <p class="label">Rest between sets</p>
      <div class="seg buttons">${[0, 60, 90, 120, 180].map(v => `<button class="${S.settings.restSec === v ? 'on' : ''}" data-act="rest-set" data-v="${v}">${v ? fmtSec(v) : 'Off'}</button>`).join('')}</div>
      <p class="label">Countdown before a hold</p>
      <div class="seg buttons">${[0, 3, 5, 10].map(v => `<button class="${S.settings.leadIn === v ? 'on' : ''}" data-act="lead-set" data-v="${v}">${v ? `${v}s` : 'Off'}</button>`).join('')}</div>

      <h2>Drill library</h2>
      ${lib}

      <h2>Backup</h2>
      <p class="sub">Your training lives only on this device. ${since}</p>
      <div class="btnrow">
        <button class="secondary small" data-act="backup-file">Download backup</button>
        <button class="secondary small" data-act="backup-copy">Copy backup code</button>
        <button class="secondary small" data-act="restore-open">Restore</button>
      </div>

      <details class="about"><summary>App decisions vs. the manual</summary>
        <p>Programming, order, sets, reps, criteria and notes come from the manual. These choices are the app's:</p>
        <ul class="plain">${IMPL_NOTES.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
      </details>

      <button class="ghost danger" data-act="reset">Erase all data</button>
    </section>`;
}

/* ---------- backup ---------- */
function backupJSON() { return JSON.stringify({ app: 'handstand', exported: new Date().toISOString(), state: S }); }
function backupFile() {
  const blob = new Blob([backupJSON()], { type: 'application/json' });
  const name = `handstand-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).then(markBackup).catch(() => {});
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); markBackup();
  }
}
function backupCopy() {
  const code = btoa(unescape(encodeURIComponent(backupJSON())));
  navigator.clipboard.writeText(code).then(() => { markBackup(); toast('Backup code copied. Paste it into Notes.'); }).catch(() => toast('Copy failed. Use Download backup.'));
}
function markBackup() { S.lastBackup = new Date().toISOString(); save(); render(); }
async function restore() {
  let text = $('#restore-text').value.trim();
  const f = $('#restore-file').files[0];
  if (f) text = await f.text();
  if (!text) { toast('Choose a file or paste a code first.'); return; }
  try {
    if (!text.startsWith('{')) text = decodeURIComponent(escape(atob(text)));
    const data = JSON.parse(text);
    if (data.app !== 'handstand' || !data.state) throw new Error();
    S = Object.assign(freshState(), data.state); save(); sheet = null; go('today'); toast('Backup restored');
  } catch (e) { toast('That is not a valid backup from this app.'); }
}

/* ---------- toast & boot ---------- */
let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }

function boot() {
  load();
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  if (S.active) view = 'today';
  render();
}

</script>
<script>
/* ==========================================================================
   PROGRAM PACK: Handstand Factory — Push
   Source: Push manual (2021). Page numbers are the printed page numbers.
   Summaries are short personal notes, not text from the manual.
   To add a future program (Keep Pushing, Press, Grip), copy this block's
   shape into a new registerProgram({...}) call.
   ========================================================================== */
registerProgram({
  id: 'push',
  name: 'Push',
  source: 'Handstand Factory',
  library: 'https://handstandfactory.com/members/push/video-library/',
  sections: {
    prep:         { name: 'Physical preparation', url: 'https://tinyurl.com/push-physical-prep' },
    conditioning: { name: 'Basic conditioning',   url: 'https://tinyurl.com/push-conditioning' },
    bailing:      { name: 'Bailing',              url: 'https://tinyurl.com/push-bailing' },
    rebalancing:  { name: 'Rebalancing',          url: 'https://tinyurl.com/push-rebalancing' },
    kickup:       { name: 'Kick-up',              url: 'https://tinyurl.com/push-kick-up' },
    freestanding: { name: 'Freestanding handstand', url: 'https://tinyurl.com/push-freestanding-handstand' },
    shoulder:     { name: 'Shoulder and wrist flexibility', url: 'https://tinyurl.com/push-shoulder' },
    pike:         { name: 'Pike flexibility',     url: 'https://tinyurl.com/push-pike' },
    other:        { name: 'Other' }
  },
  drills: {
    'wrist-warmup':       { name: 'Wrist warm-up', s: 'prep', p: 42, sum: 'Load the wrists gradually until they feel ready. Warm, not tired. Some days take 30 seconds, some take 10 minutes.' },
    'straight-body-hold': { name: 'Straight body hold', s: 'prep', p: 43, sum: 'Floor hold that rehearses the handstand line. Early on, work one segment at a time (legs or chest).' },
    'scap-pushup':        { name: 'Scapular push-ups', s: 'prep', p: 44, sum: 'Plank position. Move only the shoulder blades, pushing the floor away so the upper back rounds.' },
    'scap-pike':          { name: 'Scapular push to standing pike', s: 'prep', p: 45, sum: 'Use the shoulder-blade push to lift the hips toward a pike and feel the shoulders stack over the hands.' },
    'incline-body-line':  { name: 'Incline body line drill', s: 'conditioning', p: 47, sum: 'Feet on the wall, body inclined. The safest first time on the hands. Step off whenever you need to.' },
